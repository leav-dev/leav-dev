  <g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Courier New',monospace">
    <text x="32" y="34" font-size="14" fill="#9ece6a">✓ build passing</text>
    <text x="1168" y="34" text-anchor="end" font-size="14" fill="#565f89">leav-dev · 2026</text>
    <text x="600" y="72" text-anchor="middle" font-size="21"><tspan fill="#9ece6a">$</tspan><tspan fill="#ffffff"> thanks --for-visiting</tspan></text>
    <text x="600" y="110" text-anchor="middle" font-size="23" fill="#bb9af7">→ gracias por visitar ✦</text>
