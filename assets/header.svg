<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img">
  <title>LEAV — Full-Stack Developer terminal</title>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24273d"/>
    </linearGradient>
    <linearGradient id="hbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <pattern id="hgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#2d3355" stroke-width="1"/>
    </pattern>
    <clipPath id="hclip"><rect width="1200" height="250" rx="12"/></clipPath>
  </defs>
  <rect width="1200" height="250" rx="12" fill="url(#hbg)" stroke="#2d3355" stroke-width="2"/>
  <g clip-path="url(#hclip)">
    <rect width="1200" height="250" fill="url(#hgrid)" opacity="0.35"/>
    <rect x="880" y="-80" width="420" height="420" rx="210" fill="#7aa2f7" opacity="0.07"/>
    <rect x="-140" y="120" width="360" height="360" rx="180" fill="#667eea" opacity="0.08"/>
    <text x="1152" y="228" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="120" font-weight="700" fill="#2d3355" opacity="0.65">&gt;_</text>
  </g>
  <circle cx="34" cy="26" r="8" fill="#f7768e"/>
  <circle cx="60" cy="26" r="8" fill="#e0af68"/>
  <circle cx="86" cy="26" r="8" fill="#9ece6a"/>
  <text x="600" y="32" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" fill="#7aa2f7">leav-dev@github — zsh</text>
  <text x="1168" y="32" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14"><tspan fill="#9ece6a">●</tspan><tspan fill="#565f89"> online</tspan></text>
  <line x1="0" y1="50" x2="1200" y2="50" stroke="#2d3355" stroke-width="1"/>
  <rect x="0" y="50" width="1200" height="3" fill="url(#hbar)"/>
  <g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Courier New',monospace" font-size="21">
    <text x="48" y="100"><tspan fill="#9ece6a">$</tspan><tspan fill="#ffffff"> whoami</tspan></text>
    <text x="48" y="132"><tspan fill="#7aa2f7">luis eduardo albor vega</tspan><tspan fill="#565f89">  //  full-stack developer</tspan></text>
    <text x="48" y="172"><tspan fill="#9ece6a">$</tspan><tspan fill="#ffffff"> stack --live</tspan></text>
    <text x="48" y="204"><tspan fill="#7dcfff">go · python · react · aws · ai-augmented</tspan></text>
    <text x="48" y="238"><tspan fill="#9ece6a">$</tspan></text>
  </g>
  <rect x="74" y="218" width="12" height="22" fill="#7aa2f7">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
